<html lang="de">

<style>
:root{
  --bg:#fbf6ee; --card:#fffdf9; --ink:#2a1f17; --muted:#7a6a5c; --line:#ecdfcc; --soft:#f5ece0;
  --tomato:#c8412b; --tomato-ink:#fff; --basil:#3f7a3a; --basil-soft:#e6f0e2;
  --cheese:#f3c94b; --cheese-soft:#fcf1cf; --crust:#b9773a; --danger:#b3261e;
  --shadow:0 1px 2px rgba(60,30,10,.06),0 6px 20px rgba(60,30,10,.06);
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1410; --card:#241c16; --ink:#f4ebe0; --muted:#b4a392; --line:#3a2e24; --soft:#2d241c;
  --tomato:#e05a41; --basil:#7fbf74; --basil-soft:#24321f; --cheese:#f3c94b; --cheese-soft:#3a3016;
  --crust:#d79a5c; --danger:#ff8a80; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-anchor:auto}
body{background:var(--bg);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  padding:0 max(16px,env(safe-area-inset-left)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right))}
.wrap{max-width:620px;margin:0 auto}
header{padding:22px 0 4px;display:flex;align-items:center;gap:12px}
header .logo{font-size:34px;line-height:1}
h1{font-family:Fraunces,Georgia,serif;font-weight:800;font-size:28px;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:20px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}
.chips:empty{display:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font:500 14px Inter,sans-serif;cursor:pointer}
.chip.on{background:var(--tomato);border-color:var(--tomato);color:var(--tomato-ink)}
.chip.past{opacity:.6}

/* Termin */
.when-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.when-row .btn{flex:0 0 auto}
.when{font-family:Fraunces,Georgia,serif;font-size:24px;font-weight:800;margin:0;line-height:1.15}
.time{color:var(--muted);margin:2px 0 0;font-size:15px}
.host{margin:6px 0 0;font-size:15px;font-weight:600;color:var(--crust)}
.seats{display:flex;align-items:center;gap:10px;margin:12px 0 0;flex-wrap:wrap}
.dots{display:flex;flex-wrap:wrap;gap:4px}
.dot{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dot.full{background:var(--tomato)}
.seats-txt{font-size:14px;color:var(--muted)}
.notes{background:var(--cheese-soft);border-radius:12px;padding:9px 12px;margin:12px 0 0;white-space:pre-wrap;font-size:15px}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:14px;background:var(--soft);border-radius:999px;padding:4px 10px}
.pill.me{background:var(--basil-soft);color:var(--basil);font-weight:600}
.pill.wait{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.pill .x{font-size:16px;padding:0 0 0 2px}
.wait-label{font-size:12px;color:var(--muted);align-self:center;margin-left:4px}
.mebox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--basil-soft);color:var(--basil);border-radius:12px;padding:9px 12px;margin-top:12px;font-weight:600;font-size:15px}
.linkbtn{appearance:none;background:none;border:0;color:inherit;font:500 13px Inter,sans-serif;text-decoration:underline;cursor:pointer;padding:0;white-space:nowrap;opacity:.8}

/* Formulare & Knöpfe */
label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px;font-weight:500}
input,select,textarea{width:100%;font:16px Inter,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--crust)}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:8px;align-items:flex-end}
.row>*{flex:1;min-width:0}
.row>.shrink{flex:0 0 auto}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{appearance:none;border:0;border-radius:12px;padding:11px 16px;font:600 15px Inter,sans-serif;cursor:pointer;background:var(--tomato);color:var(--tomato-ink);white-space:nowrap}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--basil);color:#fff}
.btn.small{padding:6px 11px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.linkbtn:focus-visible,summary:focus-visible{outline:2px solid var(--crust);outline-offset:2px}
.x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:8px}
.x:hover{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt{margin-top:10px}
.muted{color:var(--muted);font-size:14px}

/* Zutaten */
.zhead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.zsum{font-size:13px;color:var(--muted)}
.basics{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 2px}
.bp{font-size:12.5px;border-radius:999px;padding:3px 9px;background:var(--basil-soft);color:var(--basil);font-weight:600}
.bp.miss{background:var(--cheese-soft);color:var(--crust)}
details.tip{margin:10px 0 4px;font-size:14px}
details.tip summary{font-weight:500;color:var(--muted)}
details.tip p{margin:6px 0 0;background:var(--cheese-soft);border-radius:12px;padding:9px 12px}
summary{cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
.grp{border-top:1px solid var(--line)}
.grp>summary{display:flex;align-items:center;gap:10px;padding:12px 0}
.grp>summary .gi{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
.grp>summary .gn{font-weight:600;flex:1;min-width:0}
.grp>summary .gs{font-size:12.5px;color:var(--muted);text-align:right}
.grp>summary .gs b{color:var(--crust);font-weight:600}
.grp>summary::after{content:"▾";color:var(--muted);font-size:13px;transition:transform .15s}
.grp[open]>summary::after{transform:rotate(180deg)}
.sublabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;margin:2px 0 2px 36px}
ul.items{list-style:none;margin:0 0 8px;padding:0}
ul.items li{display:flex;align-items:center;gap:10px;padding:6px 0;min-height:44px}
.ico{font-size:20px;width:26px;text-align:center;flex:0 0 auto}
.im{flex:1;min-width:0}
.im .t{font-weight:500;font-size:15px;line-height:1.25}
.im .s{font-size:12.5px;color:var(--muted)}
.im .who{font-size:12.5px;color:var(--basil);font-weight:600}
.basis{font-size:10.5px;font-weight:600;color:var(--crust);border:1px solid var(--crust);border-radius:6px;padding:0 4px;margin-left:5px;vertical-align:2px;opacity:.8}
.needed{font-size:10.5px;font-weight:600;color:#fff;background:var(--tomato);border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:2px}
li.done .t{color:var(--muted)}
.right{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.ok{color:var(--basil);font-size:13px;font-weight:600;white-space:nowrap}
.short{color:var(--tomato);font-size:13px;font-weight:600;white-space:nowrap}
details.custom{border-top:1px solid var(--line);padding-top:12px}
details.custom>summary{font-weight:600;color:var(--tomato)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);z-index:5}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.admin{border-color:var(--crust);border-style:dashed}
.badge{white-space:nowrap;font-size:12px;background:var(--crust);color:#fff;border-radius:999px;padding:3px 10px;font-weight:600}
.cd{display:inline-block;font-size:12px;font-weight:600;color:var(--tomato);background:var(--cheese-soft);border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:1px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.opt{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:5px 11px;font:500 13px Inter,sans-serif;cursor:pointer}
.opt.on{background:var(--basil-soft);border-color:var(--basil);color:var(--basil);font-weight:600}
ul.hints{list-style:none;margin:10px 0 2px;padding:0;display:grid;gap:6px}
ul.hints li{font-size:14px;background:var(--cheese-soft);border-radius:10px;padding:7px 10px}
.quick{margin:10px 0 4px;padding:10px;border-radius:12px;background:var(--soft)}
.ql{font-size:13px;font-weight:600;margin-bottom:7px}
.sugs{display:flex;flex-wrap:wrap;gap:6px}
.sug{appearance:none;border:1px solid var(--tomato);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 12px;font:600 14px Inter,sans-serif;cursor:pointer}
.sug::after{content:" +";color:var(--tomato)}
.sug.need{background:var(--tomato);color:var(--tomato-ink)}
.sug.need::after{color:var(--tomato-ink)}
.lv{font-weight:600}
.lv.plenty{color:var(--basil)}
.lv.low{color:var(--tomato)}
footer{text-align:center;color:var(--muted);font-size:12px;margin:24px 0}
footer a{color:inherit}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

    <div class="logo">🍕</div>

  <footer>Gastgeber? <a href="#" id="hostLink">Hier entlang</a></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const SB_URL = "https://obxwqvmmirmbfktjvhxf.supabase.co";
const SB_KEY = "sb_publishable_z8qJ_vabWK3oWcczXR2YpQ_XVu7kO5s";
const CATS = ["Teig & Mehl","Sauce","Käse","Belag","Gemüse & Kräuter","Getränke","Dessert","Sonstiges"];
const CAT_ICON = {"Teig & Mehl":"🌾","Sauce":"🥫","Käse":"🧀","Belag":"🥓","Gemüse & Kräuter":"🥬","Getränke":"🥤","Dessert":"🍰","Sonstiges":"🧺"};

// ---------- Zutatenliste ----------
// n Name · i Symbol · c Kategorie · k Suchbegriffe · x Ausschlüsse · t kurzer Tipp · b Basis · multi: jeder darf mitbringen
const CATALOG = [
  { id:"basis", name:"Teig & Sauce", icon:"🫓", items:[
    { n:"Pizzateig", i:"🫓", c:"Teig & Mehl", k:["teig"], t:"ca. 250 g pro Pizza", b:1 },
    { n:"Tomatensauce", i:"🍅", c:"Sauce", k:["tomatensauce","tomatensoße","tomatensosse","passata","pelati","san marzano"], t:"dick, nicht wässrig", b:1 },
    { n:"Hartweizengrieß", i:"🌾", c:"Teig & Mehl", k:["grieß","griess","semola"], t:"zum Ausrollen, damit nichts klebt", b:1 },
    { n:"Olivenöl", i:"🫗", c:"Sonstiges", k:["olivenöl","olivenoel"], b:1 }
  ]},
  { id:"kaese", name:"Käse", icon:"🧀", items:[
    { n:"Mozzarella", i:"🧀", c:"Käse", k:["mozzarella","pizzakäse"], x:["burrata"], t:"💧 Pizza-Mozzarella am Stück ist trockener als Kugeln aus der Lake", b:1 },
    { n:"Parmesan", i:"🧀", c:"Käse", k:["parmesan","grana","pecorino"], t:"nach dem Backen drüberhobeln", b:1 },
    { n:"Burrata", i:"🤍", c:"Käse", k:["burrata"], t:"erst nach dem Backen drauf" },
    { n:"Gorgonzola", i:"💙", c:"Käse", k:["gorgonzola"] },
    { n:"Scamorza (Räucherkäse)", i:"🟤", c:"Käse", k:["scamorza"], t:"trocken, schmilzt super" },
    { n:"Ziegenkäse", i:"🐐", c:"Käse", k:["ziegenkäse"] },
    { n:"Fior di Latte (Kuhmilch-Mozzarella)", i:"🥛", c:"Käse", k:["fior di latte"], t:"💧 vorher gut abtropfen" }
  ]},
  { id:"fleisch", name:"Fleisch & Fisch", icon:"🥓", items:[
    { n:"Salami", i:"🍕", c:"Belag", k:["salami","spianata"] },
    { n:"Kochschinken", i:"🍖", c:"Belag", k:["kochschinken","prosciutto cotto"] },
    { n:"Rohschinken (Prosciutto)", i:"🥩", c:"Belag", k:["rohschinken","parmaschinken","serrano","prosciutto"], x:["cotto"], t:"erst nach dem Backen drauf" },
    { n:"’Nduja (scharfe Streichsalami)", i:"🔥", c:"Belag", k:["nduja"], t:"kleine Kleckse reichen" },
    { n:"Thunfisch", i:"🐟", c:"Belag", k:["thunfisch"], t:"💧 gut abtropfen" },
    { n:"Garnelen", i:"🦐", c:"Belag", k:["garnele","shrimp","scampi"], t:"💧 trocken tupfen" },
    { n:"Sardellen", i:"🐠", c:"Belag", k:["sardelle"] }
  ]},
  { id:"gemuese", name:"Gemüse", icon:"🥬", items:[
    { n:"Champignons", i:"🍄", c:"Gemüse & Kräuter", k:["champignon","pilze"], t:"💧 hauchdünn schneiden" },
    { n:"Zwiebeln", i:"🧅", c:"Gemüse & Kräuter", k:["zwiebel"] },
    { n:"Paprika", i:"🫑", c:"Gemüse & Kräuter", k:["paprika"] },
    { n:"Kirschtomaten", i:"🍅", c:"Gemüse & Kräuter", k:["kirschtomate","cherrytomate","cocktailtomate"], t:"💧 halbieren, Kerne raus" },
    { n:"Rucola", i:"🥗", c:"Gemüse & Kräuter", k:["rucola","rauke"], t:"erst nach dem Backen drauf" },
    { n:"Oliven", i:"🫒", c:"Gemüse & Kräuter", k:["olive"], x:["olivenöl","olivenoel"] },
    { n:"Peperoni / Jalapeños", i:"🌶️", c:"Gemüse & Kräuter", k:["peperoni","jalape"] },
    { n:"Spinat", i:"🍃", c:"Gemüse & Kräuter", k:["spinat"], t:"💧 gut ausdrücken" },
    { n:"Zucchini", i:"🥒", c:"Gemüse & Kräuter", k:["zucchini"], t:"💧 dünn hobeln" },
    { n:"Artischocken", i:"🌱", c:"Gemüse & Kräuter", k:["artischocke"], t:"💧 abtropfen" },
    { n:"Mais", i:"🌽", c:"Gemüse & Kräuter", k:["mais"], t:"💧 abtropfen" },
    { n:"Knoblauch", i:"🧄", c:"Gemüse & Kräuter", k:["knoblauch"] }
  ]},
  { id:"extras", name:"Kräuter & Extras", icon:"🌿", items:[
    { n:"Frisches Basilikum", i:"🌿", c:"Gemüse & Kräuter", k:["basilikum"], t:"erst nach dem Backen drauf", b:1 },
    { n:"Oregano", i:"🍂", c:"Gemüse & Kräuter", k:["oregano"] },
    { n:"Chiliöl / Chiliflocken", i:"🌶️", c:"Sonstiges", k:["chili"] },
    { n:"Honig", i:"🍯", c:"Sonstiges", k:["honig"], t:"top zu Salami oder Gorgonzola" },
    { n:"Kapern", i:"🟢", c:"Gemüse & Kräuter", k:["kapern"] },
    { n:"Pesto", i:"🥣", c:"Sauce", k:["pesto"] }
  ]},
  { id:"getraenke", name:"Getränke", icon:"🥤", multi:1, note:"Bitte jeder ein bisschen was – dann muss niemand alles in den 4. Stock schleppen.", items:[
    { n:"Bier", i:"🍺", c:"Getränke", k:["bier"], multi:1 },
    { n:"Wein", i:"🍷", c:"Getränke", k:["wein"], multi:1 },
    { n:"Softdrinks", i:"🥤", c:"Getränke", k:["softdrink","limo","cola","spezi","saft"], multi:1 },
    { n:"Wasser", i:"💧", c:"Getränke", k:["wasser"], multi:1 }
  ]},
  { id:"dessert", name:"Nachtisch", icon:"🍰", items:[
    { n:"Nutella (Dessert-Pizza)", i:"🍫", c:"Dessert", k:["nutella"] },
    { n:"Nachtisch (z. B. Tiramisu)", i:"🍰", c:"Dessert", k:["tiramisu","dessert","nachtisch"] }
  ]}
];
const CAT_FLAT = CATALOG.flatMap(g => g.items);
const BASICS = CAT_FLAT.filter(e => e.b);

// ---------- Speicher im Browser (nur Komfort) ----------
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let myName = ls.get("pz_name", "");
let tokens = ls.get("pz_tokens", {});
let adminKey = ls.get("pz_admin", "");
let openState = ls.get("pz_open", {});
function saveToken(id, tok){ tokens[id] = tok; ls.set("pz_tokens", tokens); }
function dropToken(id){ delete tokens[id]; ls.set("pz_tokens", tokens); }

// ---------- Datenbank ----------
async function api(path, opts={}){
  const res = await fetch(SB_URL + "/rest/v1/" + path, {
    ...opts,
    headers: { apikey: SB_KEY, "Content-Type": "application/json", ...(opts.headers||{}) }
  });
  const txt = await res.text();
  const data = txt ? JSON.parse(txt) : null;
  if(!res.ok){ throw new Error((data && (data.message || data.hint)) || "Fehler " + res.status); }
  return data;
}
const rpc = (fn, args) => api("rpc/" + fn, { method:"POST", body: JSON.stringify(args) });

// ---------- Zustand ----------
let events = [], signups = [], items = [], selected = null, isAdmin = false, editing = false, lastSig = "";
const today = new Date(); today.setHours(0,0,0,0);
const isPast = e => new Date(e.event_date + "T00:00") < today;

async function load(force){
  const [ev, su, it] = await Promise.all([
    api("pz_events?select=id,event_date,event_time,title,max_guests,notes,closed,host&order=event_date.asc"),
    api("pz_signups?select=id,event_id,name,plus,diet,created_at&order=created_at.asc"),
    api("pz_items?select=id,event_id,name,category,qty,kind,person,created_at&order=created_at.asc")
  ]);
  const sig = JSON.stringify([ev, su, it]);
  if(!force && sig === lastSig) return;          // nichts geändert → nichts neu zeichnen (kein Springen)
  lastSig = sig; events = ev; signups = su; items = it;
  const visible = visibleEvents();
  const wanted = new URLSearchParams(location.search).get("e");
  if(!selected || !events.find(e => e.id === selected)){
    selected = (wanted && events.find(e => e.id === wanted) ? wanted : null)
      || (visible.find(e => !isPast(e)) || visible[visible.length-1] || {}).id || null;
  }
  render();
}

function visibleEvents(){
  if(isAdmin){
    const past = events.filter(isPast).slice(-3);
    return [...past, ...events.filter(e => !isPast(e))];
  }
  return events.filter(e => !isPast(e));
}

// ---------- Hilfen ----------
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = (d, opt) => new Date(d + "T00:00").toLocaleDateString("de-DE", opt);
function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2600); }
function needName(){
  const v = (document.getElementById("nameInput")?.value || myName || "").trim();
  if(!v){ toast("Bitte oben zuerst deinen Namen eintragen"); const n = document.getElementById("nameInput"); if(n){ n.focus({preventScroll:false}); } return null; }

// Plätze: Begleitungen belegen auch einen Platz, Reihenfolge = Anmeldezeit
function seatSplit(ev){
  const guests = signups.filter(s => s.event_id === ev.id);
  let used = 0; const confirmed = [], waiting = [];
  for(const g of guests){
    const need = 1 + (g.plus || 0);
    if(!waiting.length && used + need <= ev.max_guests){ confirmed.push(g); used += need; } else waiting.push(g);
  }
  return { guests, confirmed, waiting, used, free: Math.max(0, ev.max_guests - used) };
}
function countdown(ev){
  const d = Math.round((new Date(ev.event_date + "T00:00") - today) / 864e5);
  return d < 0 ? "" : d === 0 ? "heute" : d === 1 ? "morgen" : `in ${d} Tagen`;
}
const DIET = { vegetarisch: "🥦", vegan: "🌱" };
let joinPlus = 0, joinDiet = "";
function optChips(plus, diet, who){

    <button class="opt ${plus ? "on" : ""}" data-opt="plus" data-who="${who}">${plus ? `👥 +${plus} Begleitung` : "👥 + Begleitung"}</button>
    <button class="opt ${diet === "vegetarisch" ? "on" : ""}" data-opt="vegetarisch" data-who="${who}">🥦 vegetarisch</button>
    <button class="opt ${diet === "vegan" ? "on" : ""}" data-opt="vegan" data-who="${who}">🌱 vegan</button>
  </div>`;
}

// ---------- Mitdenken: Mengen, Hinweise, Vorschläge ----------
// Wie viel braucht eine Gruppe ungefähr, abhängig von der Gästezahl n?
const TARGET = {
  kaese:     n => Math.max(2, Math.ceil(n / 3)),
  fleisch:   n => Math.max(2, Math.ceil(n / 3)),
  gemuese:   n => Math.max(3, Math.ceil(n / 2)),
  extras:    n => 2,
  getraenke: n => Math.max(2, Math.ceil(n * 0.7)),
  dessert:   n => 1
};
const GROUP_CAT = { kaese:"Käse", fleisch:"Belag", getraenke:"Getränke", dessert:"Dessert" };
function groupAmount(g, pool, others){
  let n = 0;
  for(const e of g.items){ const st = entryState(e, pool); n += st.bring.length + (st.have.length ? 1 : 0); }
  if(GROUP_CAT[g.id]) n += others.filter(i => i.category === GROUP_CAT[g.id] && i.kind !== "bedarf").length;
  return n;
}
function groupLevel(g, pool, others, people){
  const t = TARGET[g.id]; if(!t) return { level: "", amount: 0, target: 0 };
  const target = t(people), amount = groupAmount(g, pool, others);
  const optional = g.id === "extras" || g.id === "dessert";   // Kür: nie „knapp“, nur „reichlich“
  const level = amount < target ? (optional ? "ok" : "low") : (amount >= Math.ceil(target * 1.6) && amount >= target + 2) ? "plenty" : "ok";
  return { level, amount, target };
}
function smartInfo(ev, pool, others){
  const { confirmed, used } = seatSplit(ev);
  PLAN = planFor(ev);
  const people = PLAN.people;
  const levels = Object.fromEntries(CATALOG.map(g => [g.id, groupLevel(g, pool, others, people)]));
  const hints = [];
  const needOpen = pool.filter(i => i.kind === "bedarf" && !i.person);
  if(needOpen.length) hints.push(`🙏 Wird noch gebraucht: ${needOpen.map(i => i.name).join(", ")}`);
  for(const g of CATALOG){
    const l = levels[g.id];
    if(l.level === "plenty" && !g.multi){
      const lowList = CATALOG.filter(x => levels[x.id].level === "low" && !x.multi && x.id !== g.id && TARGET[x.id])
        .sort((a, b) => (levels[a.id].amount / levels[a.id].target) - (levels[b.id].amount / levels[b.id].target) || (b.id === "gemuese") - (a.id === "gemuese"));
      const low = lowList[0];
      hints.push(`${g.icon} ${g.name} gibt's schon reichlich (${l.amount}×)${low ? ` – vielleicht lieber ${low.name}?` : ""}`);
    }
  }
  const shortList = CAT_FLAT.map(e => ({ e, st: entryState(e, pool) }))
    .filter(x => x.st.meter && !x.st.meter.ok && (x.st.have.length || x.st.bring.length))
    .map(x => `~${fmtAmt(x.st.meter.need - x.st.meter.got, x.st.meter.m)} ${x.e.n.replace("Frisches ","")}`);
  if(shortList.length) hints.push(`📏 Für ${people} Personen fehlt noch: ${shortList.join(", ")}`);
  const veg = confirmed.filter(g => g.diet).length;
  if(veg && levels.gemuese.amount < Math.max(2, veg)) hints.push(`🥦 ${veg} ${veg === 1 ? "Gast isst" : "Gäste essen"} vegetarisch – Gemüse-Belag ist noch knapp`);
  if(used >= 3 && levels.getraenke.level === "low") hints.push(levels.getraenke.amount
    ? `🥤 Erst ${levels.getraenke.amount}× Getränke zugesagt – bringt gern jeder etwas für sich mit`
    : `🥤 Noch keine Getränke zugesagt – bringt gern jeder etwas für sich mit`);

  // Schnell-Vorschläge: zuerst was der Gastgeber braucht, dann fehlende Basics, dann knappe Gruppen
  const sugg = [];
  const seen = new Set();
  const add = (e, claimId) => { if(sugg.length < 4 && !seen.has(e.n)){ seen.add(e.n); sugg.push({ e, claimId }); } };
  for(const e of CAT_FLAT){ const st = entryState(e, pool); if(st.need) add(e, st.need.id); }
  const basicsOrder = [...BASICS].sort((a, b) => (!!entryState(b, pool).meter) - (!!entryState(a, pool).meter));   // Mengen zuerst
  let nb = 0; for(const e of basicsOrder){ if(nb < 2 && !entryState(e, pool).covered){ add(e); nb++; } }
  const vegGuests = confirmed.filter(g => g.diet).length;
  const lowGroups = CATALOG.filter(g => levels[g.id].level === "low" && !g.multi)
    .sort((a, b) => (vegGuests ? (b.id === "gemuese") - (a.id === "gemuese") : 0) || (levels[a.id].amount / levels[a.id].target) - (levels[b.id].amount / levels[b.id].target));
  // ein Getränk vorschlagen, wenn ich selbst noch keins zugesagt habe
  const drinks = CATALOG.find(g => g.id === "getraenke");
  if(levels.getraenke.level === "low" && !drinks.items.some(e => entryState(e, pool).mine)){
    const d = [...drinks.items].sort((a, b) => entryState(a, pool).bring.length - entryState(b, pool).bring.length)[0];
    if(d) add(d);
  }
  for(let round = 0; round < 2; round++) for(const g of lowGroups){
    const cand = g.items.filter(e => !entryState(e, pool).covered)[round]; if(cand) add(cand);
  }
  return { levels, hints: hints.slice(0, 3), sugg, people };
}

// Welche Einträge passen zu einem Listeneintrag?
function catMatch(entry, pool){
  return pool.filter(i => {
    const n = i.name.toLowerCase();
    if((entry.x || []).some(x => n.includes(x))) return false;
    return entry.k.some(k => n.includes(k));
  });
}
// ---------- Mengen: Bedarf nach Personenzahl ----------
// per = Menge pro Person · def = angenommene Menge, wenn ein Gast nichts angibt · packs = übliche Packungsgrößen
const METER = {
  "Pizzateig":          { per: 1,   unit: "count", label: "Teiglinge", def: 4, gPer: 250, packs: { teigling: 1, ballen: 1, kugel: 1, "stück": 1, stk: 1, portion: 1 } },
  "Tomatensauce":       { per: 80,  unit: "g", def: 400, packs: { dose: 400, glas: 500, "gläser": 500, flasche: 700, packung: 500, tetra: 500 } },
  "Mozzarella":         { per: 100, unit: "g", def: 250, packs: { kugel: 125, rolle: 400, stange: 400, block: 400, packung: 250, beutel: 250 } },
  "Frisches Basilikum": { per: 1/6, unit: "count", label: "Töpfe", def: 1, packs: { topf: 1, "töpfe": 1, bund: 1 } }
};
let PLAN = null;   // { people, final } für den gerade angezeigten Termin
function daysUntil(ev){ return Math.round((new Date(ev.event_date + "T00:00") - today) / 864e5); }
function planFor(ev){
  if(!ev) return null;
  const { used } = seatSplit(ev);
  const hosts = ev.host && /&|\bund\b|,/.test(ev.host) ? 2 : 1;
  const final = ev.closed || isPast(ev);      // Anmeldung geschlossen: echte Gästezahl, sonst alle Plätze
  return { people: (final ? used : Math.max(used, ev.max_guests)) + hosts, final };
}
function parseQty(q, m){
  if(!q) return null;
  const s = String(q).toLowerCase().replace(",", ".");
  const hit = s.match(/\d+(\.\d+)?/); const n = hit ? parseFloat(hit[0]) : 1;
  if(/kg/.test(s)) return m.unit === "g" ? n * 1000 : (m.gPer ? n * 1000 / m.gPer : null);
  if(/\d\s*g\b|gramm/.test(s)) return m.unit === "g" ? n : (m.gPer ? n / m.gPer : null);
  for(const [k, v] of Object.entries(m.packs)) if(s.includes(k)) return n * v;
  return hit ? (m.unit === "g" ? n * m.def : n) : null;
}
function fmtAmt(v, m){
  if(m.unit === "g"){
    if(v >= 1000) return (Math.round(v / 100) / 10).toString().replace(".", ",") + " kg";
    return Math.max(50, Math.round(v / 50) * 50) + " g";
  }
  const c = Math.max(1, Math.ceil(v - 0.01));
  return c + " " + (c === 1 ? m.label.replace(/e$/, "").replace("Töpfe", "Topf").replace("Teiglinge","Teigling") : m.label);
}
function meterState(entry, have, bring){
  const m = METER[entry.n]; if(!m || !PLAN) return null;
  const need = PLAN.people * m.per;
  let got = 0, unknown = false;
  for(const i of have){ const v = parseQty(i.qty, m); if(v == null) unknown = true; else got += v; }
  for(const i of bring){ const v = parseQty(i.qty, m); got += v == null ? m.def : v; }
  return { m, need, got, unknown, ok: unknown || got >= need * 0.95 };
}

function entryState(entry, pool){
  const hits = catMatch(entry, pool);
  const have = hits.filter(i => i.kind === "vorrat");
  const bring = hits.filter(i => i.kind === "mitbringsel" || (i.kind === "bedarf" && i.person));
  const need = hits.find(i => i.kind === "bedarf" && !i.person);
  const mine = bring.find(i => tokens[i.id]);
  const meter = meterState(entry, have, bring);
  const any = have.length > 0 || bring.length > 0;
  return { hits, have, bring, need, mine, meter, covered: meter ? any && meter.ok : any };
}
const whoText = list => list.map(i => tokens[i.id] ? "du" : i.person).join(", ");

function itemRow({ icon, name, tip, basis, st, multi, idx, ev, open, extra }){
  let status = "", sub = "";
  const mt = st.meter;
  if(mt && (st.have.length || st.bring.length)){
    status = mt.unknown ? `<span class="ok">✓ da</span>`
      : mt.ok ? `<span class="ok">✓ ${esc(fmtAmt(mt.got, mt.m))}</span>`
      : `<span class="short">${esc(fmtAmt(mt.got, mt.m))} / ${esc(fmtAmt(mt.need, mt.m))}</span>`;
  } else if(st.have.length) status = `<span class="ok">✓ da${st.have[0].qty ? ` · ${esc(st.have[0].qty)}` : ""}</span>`;
  if(mt) sub = mt.unknown
    ? `Bedarf für ${PLAN.people} Pers.: ~${fmtAmt(mt.need, mt.m)} · ${isAdmin ? "Menge eintragen ✎" : "Menge noch offen"}`
    : `Bedarf für ${PLAN.people} Pers.: ~${fmtAmt(mt.need, mt.m)}${!mt.ok && (st.have.length || st.bring.length) ? ` · fehlt ~${fmtAmt(mt.need - mt.got, mt.m)}` : ""}`;
  let who = st.bring.length ? `<div class="who">🙋 ${esc(st.bring.map(i => (tokens[i.id] ? "du" : i.person) + (mt && i.qty ? ` (${i.qty})` : "")).join(", "))}</div>` : "";
  let btns = "";
  if(isAdmin){
    if(st.have.length) btns += `<button class="x" aria-label="Menge ändern" data-qty-adm="${st.have[0].id}" data-qty-cur="${esc(st.have[0].qty || "")}">✎</button><button class="x" aria-label="Aus dem Vorrat entfernen" data-adm-ids="${st.have.map(i=>i.id).join(",")}">×</button>`;
    else if(st.need) btns += `<button class="x" aria-label="Nicht mehr gebraucht" data-adm-ids="${st.need.id}">×</button>`;
    else if(idx != null){
      btns += `<button class="btn ghost small" data-cat-have="${idx}">Ist da</button>`;
      if(ev && open && !st.bring.length) btns += `<button class="btn ghost small" data-cat-need="${idx}">Fehlt</button>`;
    }
    if(extra && !st.have.length && !st.need) btns += `<button class="x" aria-label="Löschen" data-adm-ids="${extra.id}">×</button>`;
  } else if(ev && open){
    if(st.mine) btns += (mt && st.mine.kind === "mitbringsel" ? `<button class="x" aria-label="Menge ändern" data-qty-mine="${st.mine.id}" data-qty-cur="${esc(st.mine.qty || "")}">✎</button>` : "") + (st.mine.kind === "bedarf"
      ? `<button class="btn ghost small" data-unclaim="${st.mine.id}">Doch nicht</button>`
      : `<button class="btn ghost small" data-rm="${st.mine.id}">Doch nicht</button>`);
    else if(st.need) btns += `<button class="btn small" data-claim="${st.need.id}">Bringe ich</button>`;
    else if(idx != null && mt && !st.covered) btns += `<button class="btn ghost small" data-cat-bring="${idx}">${st.have.length || st.bring.length ? "Rest bringe ich" : "Bringe ich"}</button>`;
    else if(idx != null && !mt && !st.have.length && (!st.bring.length || multi)) btns += `<button class="btn ghost small" data-cat-bring="${idx}">${st.bring.length ? "Ich auch" : "Bringe ich"}</button>`;
  }
  const flags = (basis ? `<span class="basis">Basis</span>` : "") + (st.need ? `<span class="needed">fehlt</span>` : "");
  return `<li class="${st.covered && !multi ? "done" : ""}"><span class="ico" aria-hidden="true">${icon}</span>
    <div class="im"><div class="t">${esc(name)}${flags}</div>${who}${sub ? `<div class="s">${esc(sub)}</div>` : ""}</div>
    <div class="right">${status}${btns}</div></li>`;
}

function zutatenCard(ev, open){
  PLAN = planFor(ev);
  const pool = [...items.filter(i => i.kind === "vorrat" && !i.event_id), ...(ev ? items.filter(i => i.event_id === ev.id) : [])];

  // Basis-Übersicht
  const basicsHtml = BASICS.map(e => {
    const st = entryState(e, pool);
    const half = !st.covered && st.meter && st.meter.got > 0;
    return `<span class="bp ${st.covered ? "" : "miss"}">${st.covered ? "✓" : half ? "◐" : "○"} ${esc(e.n.replace("Frisches ",""))}</span>`;
  }).join("");

  // Einträge, die zu keinem Listeneintrag passen
  const known = new Set(CAT_FLAT.flatMap(e => catMatch(e, pool).map(i => i.id)));
  const others = pool.filter(i => !known.has(i.id));
  const smart = ev ? smartInfo(ev, pool, others) : null;

  let totalMissing = 0, totalNeeded = 0;
  const groupsHtml = CATALOG.map(g => {
    const rows = g.items.map(e => ({ e, idx: CAT_FLAT.indexOf(e), st: entryState(e, pool) }));
    const missing = rows.filter(r => !r.st.covered || (g.multi && !r.st.mine && !isAdmin));
    const covered = rows.filter(r => r.st.covered);
    // Was fehlt: zuerst „wird gebraucht“, dann Basis, dann Rest
    const missRows = rows.filter(r => !r.st.covered).sort((a,b) => (!!b.st.need - !!a.st.need) || ((b.e.b||0) - (a.e.b||0)));
    const needed = rows.filter(r => r.st.need).length;
    totalNeeded += needed; totalMissing += rows.filter(r => !r.st.covered && r.e.b).length;
    const row = r => itemRow({ icon:r.e.i, name:r.e.n, tip:r.e.t, basis:r.e.b, st:r.st, multi:g.multi, idx:r.idx, ev, open });
    let body;
    if(g.multi){
      body = `<p class="muted" style="margin:0 0 6px 36px">${esc(g.note)}</p><ul class="items">${rows.map(row).join("")}</ul>`;
    } else {
      body = (missRows.length ? `<div class="sublabel">Fehlt noch</div><ul class="items">${missRows.map(row).join("")}</ul>` : "")
           + (covered.length ? `<div class="sublabel">Ist abgedeckt</div><ul class="items">${covered.map(row).join("")}</ul>` : "");
    }
    const info = g.multi
      ? (() => { const n = rows.reduce((s,r)=>s + r.st.bring.length, 0); return n ? `${n}× zugesagt` : `<b>noch nichts</b>`; })()
      : `${covered.length}/${rows.length} da${needed ? ` · <b>${needed} fehlt</b>` : ""}`;
    const lvl = smart?.levels[g.id]?.level;
    const lvlTag = lvl === "plenty" ? ` · <span class="lv plenty">reichlich</span>` : (lvl === "low" && ev && open) ? ` · <span class="lv low">knapp</span>` : "";
    const def = g.id === "basis" || needed > 0;
    return `<details class="grp" data-key="g-${g.id}" ${isOpen("g-"+g.id, def) ? "open" : ""}>
      <summary><span class="gi" aria-hidden="true">${g.icon}</span><span class="gn">${esc(g.name)}</span><span class="gs">${info}${lvlTag}</span></summary>
      ${body}</details>`;
  }).join("");

  const otherHtml = others.length ? `<details class="grp" data-key="g-other" ${isOpen("g-other", true) ? "open" : ""}>
      <summary><span class="gi" aria-hidden="true">🧺</span><span class="gn">Weitere Einträge</span><span class="gs">${others.length}</span></summary>
      <ul class="items">${others.map(i => {
        const st = { hits:[i], have: i.kind==="vorrat" ? [i] : [], bring: (i.kind==="mitbringsel" || (i.kind==="bedarf" && i.person)) ? [i] : [],
                     need: i.kind==="bedarf" && !i.person ? i : null, mine: tokens[i.id] && i.kind !== "vorrat" ? i : null };
        st.covered = st.have.length || st.bring.length;
        return itemRow({ icon: CAT_ICON[i.category] || "🧺", name: i.name + (i.qty && i.kind !== "vorrat" ? ` · ${i.qty}` : ""), st, idx:null, ev, open, extra:i });
      }).join("")}</ul></details>` : "";

  const custom = (open || isAdmin) ? `<details class="custom" data-key="custom" ${isOpen("custom", false) ? "open" : ""}>
      <summary>+ Etwas anderes eintragen</summary>
      <div class="mt"><input id="itName" placeholder="z. B. Ananas, Feigen, Trüffelöl …" maxlength="60" aria-label="Zutat"></div>
      <div class="grid2 mt"><input id="itQty" placeholder="Menge (optional)" maxlength="30" aria-label="Menge">
        <select id="itCat" aria-label="Kategorie">${CATS.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      <div class="actions mt">${isAdmin
        ? `<button class="btn green small" data-addadm="vorrat">Ist da (Vorrat)</button>${ev && open ? `<button class="btn small" data-addadm="bedarf">Fehlt noch</button>` : ""}`
        : `<button class="btn green small" id="addItemBtn">Bringe ich mit</button>`}</div>
    </details>` : "";

  return `<div class="card">
    <div class="zhead"><h2>Zutaten</h2><span class="zsum">${PLAN ? `geplant für ${PLAN.people} ${PLAN.people === 1 ? "Person" : "Personen"}${PLAN.final ? "" : " (alle Plätze)"}` : "Tippe an, was du mitbringst"}</span></div>
    ${isAdmin && ev && open ? `<div class="actions" style="margin-top:8px"><button class="btn ghost small" id="missBtn">📋 Was fehlt – in WhatsApp</button></div>` : ""}
    <div class="basics" aria-label="Basis-Zutaten">${basicsHtml}</div>
    ${smart && smart.hints.length ? `<ul class="hints">${smart.hints.map(h => `<li>${esc(h)}</li>`).join("")}</ul>` : ""}
    ${smart && open && !isAdmin && smart.sugg.length ? `<div class="quick"><div class="ql">⚡ Mit einem Tipp mitbringen – das fehlt am meisten:</div><div class="sugs">${smart.sugg.map(({e, claimId}) =>
        claimId ? `<button class="sug need" data-claim="${claimId}">${e.i} ${esc(e.n)}</button>` : `<button class="sug" data-cat-bring="${CAT_FLAT.indexOf(e)}">${e.i} ${esc(e.n)}</button>`).join("")}</div></div>` : ""}
    <details class="tip" data-key="tip" ${isOpen("tip", false) ? "open" : ""}><summary>💧 Tipp: Je trockener, desto besser ▾</summary>
      <p>Im heißen Ofen verdampft Wasser nicht schnell genug, der Boden wird matschig. Also lieber Pizza-Mozzarella am Stück als Kugeln aus der Lake (die gut abtropfen lassen), Dosenware abtropfen, Gemüse dünn schneiden. Frisches wie Rucola, Burrata oder Rohschinken erst nach dem Backen drauf.</p></details>
    ${groupsHtml}${otherHtml}${custom}
  </div>`;
}

// ---------- Gastgeber-Bereich ----------
function renderAdminBox(){
  document.getElementById("adminBox").innerHTML = isAdmin ? `<div class="card admin">
    <div class="actions" style="align-items:center"><span class="badge" style="margin-right:auto">Gastgeber-Modus</span>
    <button class="btn small" id="newEvBtn">+ Neuer Termin</button>
    <button class="btn ghost small" id="logoutBtn">Abmelden</button></div>
    ${editing ? eventForm(editing === "new" ? null : events.find(e => e.id === editing), editing === "new" ? copyFrom : null) : ""}
  </div>` : "";
}
let copyFrom = null;
function eventForm(ev, tpl){
  const src = ev || tpl;
  const d = ev ? ev.event_date : tpl ? new Date(new Date(tpl.event_date + "T12:00").getTime() + 28*864e5).toISOString().slice(0,10) : new Date(Date.now()+14*864e5).toISOString().slice(0,10);
  return `<div class="mt"><h2 style="margin-bottom:10px">${ev ? "Termin bearbeiten" : tpl ? "Termin kopieren" : "Neuer Termin"}</h2>
    <div class="grid2"><div><label for="fDate">Datum</label><input type="date" id="fDate" value="${esc(d)}"></div>
    <div><label for="fTime">Uhrzeit</label><input type="time" id="fTime" value="${esc(src?.event_time || "19:00")}"></div></div>
    <div class="mt"><label for="fHost">Gastgeber</label><input id="fHost" list="hostList" value="${esc(src?.host || "")}" placeholder="z. B. Lars, Mary oder Lars &amp; Mary" maxlength="60">
      <datalist id="hostList"><option value="Lars"><option value="Mary"><option value="Lars &amp; Mary"></datalist></div>
    <div class="grid2 mt"><div><label for="fTitle">Titel</label><input id="fTitle" value="${esc(src?.title || "Pizzaabend")}" placeholder="z. B. Mädelsabend" maxlength="60"></div>
    <div><label for="fMax">Plätze</label><input type="number" id="fMax" min="1" max="40" value="${src?.max_guests || 8}"></div></div>
    <div class="mt"><label for="fNotes">Infos für alle (optional)</label><textarea id="fNotes" placeholder="z. B. Teig mache ich, bringt Belag mit!">${esc(src?.notes || "")}</textarea></div>
    ${ev ? `<label class="mt" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="fClosed" style="width:auto" ${ev.closed?"checked":""}> Anmeldung schließen</label>` : ""}
    <div class="actions mt"><button class="btn" id="saveEvBtn" data-id="${ev?.id || ""}">Speichern</button>
    <button class="btn ghost" id="cancelEvBtn">Abbrechen</button>
    ${ev ? `<button class="btn ghost" id="copyEvBtn" data-id="${ev.id}">⧉ Kopieren</button>` : ""}
    ${ev ? `<button class="btn ghost" style="color:var(--danger);margin-left:auto" id="delEvBtn" data-id="${ev.id}">Löschen</button>` : ""}</div></div>`;
}

// Auf-/Zuklappen merken (verhindert Springen beim Neuzeichnen)
document.addEventListener("toggle", e => {
  const d = e.target; if(!(d instanceof HTMLDetailsElement) || !d.dataset.key) return;
  openState[d.dataset.key] = d.open; ls.set("pz_open", openState);
}, true);

// ---------- Klicks ----------
document.addEventListener("click", async (e) => {
  const t = e.target.closest("button, a"); if(!t) return;
  const ev = events.find(x => x.id === selected);

  if(t.dataset.ev){ selected = t.dataset.ev; editing = false; render(); return; }
  if(t.id === "hostLink"){ e.preventDefault(); return hostLogin(); }

  if(t.id === "joinBtn"){ const n = needName(); if(!n) return;
    return act(async()=>{ const r = await rpc("pz_join2",{p_event:ev.id,p_name:n,p_plus:joinPlus,p_diet:joinDiet||null}); saveToken(r.id, r.token); joinPlus = 0; joinDiet = ""; }, "Du bist dabei 🍕 – tippe unten an, was du mitbringst"); }
  if(t.dataset.opt){
    const o = t.dataset.opt, who = t.dataset.who;
    const cur = who === "join" ? { plus: joinPlus, diet: joinDiet } : (() => { const g = signups.find(x => x.id === who); return { plus: g?.plus || 0, diet: g?.diet || "" }; })();
    if(o === "plus") cur.plus = (cur.plus + 1) % 3; else cur.diet = cur.diet === o ? "" : o;
    if(who === "join"){ joinPlus = cur.plus; joinDiet = cur.diet; return render(); }
    return act(()=>rpc("pz_update_signup",{p_id:who,p_token:tokens[who],p_plus:cur.plus,p_diet:cur.diet||null}), o === "plus" ? (cur.plus ? `+${cur.plus} Begleitung eingetragen` : "Ohne Begleitung") : "Gespeichert"); }
  if(t.id === "calBtn"){ return addToCalendar(ev); }
  if(t.id === "missBtn"){ return shareMissing(ev); }
  if(t.dataset.leave){ if(!confirm("Wirklich absagen?")) return;
    return act(async()=>{ await rpc("pz_leave",{p_id:t.dataset.leave,p_token:tokens[t.dataset.leave]}); dropToken(t.dataset.leave); }, "Abgesagt"); }

  if(t.id === "addItemBtn"){ const n = needName(); if(!n) return;
    const name = document.getElementById("itName").value.trim(); if(!name) return toast("Was bringst du mit?");
    const dup = similar(name, ev); if(dup && !confirm(`Gibt es schon: ${dup}. Trotzdem eintragen?`)) return;
    return act(async()=>{ const r = await rpc("pz_add_item",{p_event:ev.id,p_name:name,p_category:document.getElementById("itCat").value,p_qty:document.getElementById("itQty").value,p_person:n}); saveToken(r.id, r.token); }, "Eingetragen"); }
  if(t.dataset.rm){ return act(async()=>{ await rpc("pz_remove_item",{p_id:t.dataset.rm,p_token:tokens[t.dataset.rm]}); dropToken(t.dataset.rm); }, "Wieder ausgetragen"); }
  if(t.dataset.claim){ const n = needName(); if(!n) return;
    return act(async()=>{ const r = await rpc("pz_claim",{p_id:t.dataset.claim,p_person:n}); saveToken(r.id, r.token); }, "Danke, ist notiert!"); }
  if(t.dataset.unclaim){ return act(async()=>{ await rpc("pz_unclaim",{p_id:t.dataset.unclaim,p_token:tokens[t.dataset.unclaim]}); dropToken(t.dataset.unclaim); }, "Wieder freigegeben"); }
  if(t.dataset.catBring){ const n = needName(); if(!n) return; const c = CAT_FLAT[+t.dataset.catBring];
    const g = CATALOG.find(x => x.items.includes(c));
    const pool = [...items.filter(i => i.kind === "vorrat" && !i.event_id), ...items.filter(i => i.event_id === ev.id)];
    const known = new Set(CAT_FLAT.flatMap(e => catMatch(e, pool).map(i => i.id)));
    const lv = smartInfo(ev, pool, pool.filter(i => !known.has(i.id))).levels[g.id];
    const st = entryState(c, pool);
    const qty = st.meter && !st.meter.unknown ? "~" + fmtAmt(Math.max(st.meter.need - st.meter.got, st.meter.m.unit === "g" ? 100 : 1), st.meter.m) : "";
    const msg = lv?.level === "plenty" ? `Eingetragen – Hinweis: ${g.name} gibt's schon reichlich (${lv.amount}×)` : `Danke! ${qty ? qty + " " : ""}${c.n} ist eingetragen${qty ? " – Menge änderbar mit ✎" : ""}`;
    return act(async()=>{ const r = await rpc("pz_add_item",{p_event:ev.id,p_name:c.n,p_category:c.c,p_qty:qty,p_person:n}); saveToken(r.id, r.token); }, msg); }
  if(t.dataset.qtyAdm || t.dataset.qtyMine){
    const v = prompt("Menge, z. B. 1 kg, 2 Rollen, 3 Kugeln, 10 Teiglinge:", t.dataset.qtyCur || ""); if(v === null) return;
    return act(() => t.dataset.qtyAdm
      ? rpc("pz_admin_set_qty",{p_key:adminKey,p_id:t.dataset.qtyAdm,p_qty:v})
      : rpc("pz_set_qty",{p_id:t.dataset.qtyMine,p_token:tokens[t.dataset.qtyMine],p_qty:v}), "Menge gespeichert"); }

  if(t.id === "waBtn" || t.id === "copyBtn"){
    const url = location.origin + location.pathname + "?e=" + ev.id;
    const guests = signups.filter(s => s.event_id === ev.id).length;
    const free = Math.max(0, ev.max_guests - guests);
    const text = `🍕 ${ev.title} am ${fmtDate(ev.event_date,{weekday:'long',day:'numeric',month:'long'})} um ${ev.event_time} Uhr – ${free ? `noch ${free} Plätze frei` : "Warteliste offen"}. Anmelden & Zutaten absprechen: ${url}`;
    if(t.id === "waBtn") window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    else { try{ await navigator.clipboard.writeText(url); toast("Link kopiert"); }catch(_){ prompt("Link kopieren:", url); } }
    return;
  }

  // Gastgeber
  if(t.id === "logoutBtn"){ isAdmin = false; adminKey = ""; ls.set("pz_admin",""); editing = false; return load(true); }
  if(t.id === "newEvBtn"){ editing = "new"; copyFrom = null; return render(); }
  if(t.id === "copyEvBtn"){ copyFrom = events.find(x => x.id === t.dataset.id); editing = "new"; render(); window.scrollTo({top:0,behavior:"smooth"}); return toast("Kopie – Datum anpassen und speichern"); }
  if(t.dataset.editEv){ editing = t.dataset.editEv; render(); window.scrollTo({top:0,behavior:"smooth"}); return; }
  if(t.id === "cancelEvBtn"){ editing = false; copyFrom = null; return render(); }
  if(t.id === "saveEvBtn"){
    const id = t.dataset.id || null; const date = document.getElementById("fDate").value; if(!date) return toast("Datum fehlt");
    return act(async()=>{
      const newId = await rpc("pz_admin_save_event",{p_key:adminKey,p_id:id,p_date:date,p_time:document.getElementById("fTime").value,
        p_title:document.getElementById("fTitle").value,p_max:parseInt(document.getElementById("fMax").value)||8,
        p_notes:document.getElementById("fNotes").value,p_closed:!!document.getElementById("fClosed")?.checked,
        p_host:document.getElementById("fHost").value});
      selected = newId; editing = false; copyFrom = null;
    }, "Termin gespeichert"); }
  if(t.id === "delEvBtn"){ if(!confirm("Termin mit allen Anmeldungen und Einträgen löschen?")) return;
    return act(async()=>{ await rpc("pz_admin_delete_event",{p_key:adminKey,p_id:t.dataset.id}); selected = null; editing = false; }, "Termin gelöscht"); }
  if(t.dataset.catHave){ const c = CAT_FLAT[+t.dataset.catHave];
    return act(()=>rpc("pz_admin_add_item",{p_key:adminKey,p_event:null,p_kind:"vorrat",p_name:c.n,p_category:c.c,p_qty:""}), `${c.n}: ist da`); }
  if(t.dataset.catNeed){ const c = CAT_FLAT[+t.dataset.catNeed];
    return act(()=>rpc("pz_admin_add_item",{p_key:adminKey,p_event:ev.id,p_kind:"bedarf",p_name:c.n,p_category:c.c,p_qty:""}), `${c.n}: fehlt noch`); }
  if(t.dataset.addadm){
    const name = document.getElementById("itName").value.trim(); if(!name) return toast("Zutat fehlt");
    const kind = t.dataset.addadm;
    return act(()=>rpc("pz_admin_add_item",{p_key:adminKey,p_event:kind==="vorrat"?null:ev.id,p_kind:kind,p_name:name,
      p_category:document.getElementById("itCat").value,p_qty:document.getElementById("itQty").value}), "Hinzugefügt"); }
  if(t.dataset.admIds){ return act(async()=>{ for(const id of t.dataset.admIds.split(",")) await rpc("pz_admin_remove",{p_key:adminKey,p_kind:"item",p_id:id}); }, "Entfernt"); }
  if(t.dataset.adm){ return act(()=>rpc("pz_admin_remove",{p_key:adminKey,p_kind:t.dataset.adm,p_id:t.dataset.id}), "Entfernt"); }
});

function addToCalendar(ev){
  const [h, m] = (ev.event_time || "19:00").split(":").map(Number);
  const pad = n => String(n).padStart(2, "0");
  const d = ev.event_date.replace(/-/g, "");
  const start = `${d}T${pad(h)}${pad(m)}00`, end = `${d}T${pad(Math.min(h + 4, 23))}${pad(m)}00`;
  const url = location.origin + location.pathname + "?e=" + ev.id;
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Pizzaabend//DE","BEGIN:VEVENT",
    `UID:${ev.id}@pizzaabend`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g,"").slice(0,15)}Z`,
    `DTSTART:${start}`, `DTEND:${end}`, `SUMMARY:🍕 ${ev.title}${ev.host ? " bei " + ev.host : ""}`,
    `DESCRIPTION:Wer bringt was mit? ${url}`, `URL:${url}`,
    "BEGIN:VALARM","TRIGGER:-P1D","ACTION:DISPLAY","DESCRIPTION:Morgen ist Pizzaabend – schon eingekauft?","END:VALARM",
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
  a.download = "pizzaabend.ics"; document.body.appendChild(a); a.click(); a.remove();
  toast("Kalendereintrag mit Erinnerung am Vortag");
}
function shareMissing(ev){
  const pool = [...items.filter(i => i.kind === "vorrat" && !i.event_id), ...items.filter(i => i.event_id === ev.id)];
  const known = new Set(CAT_FLAT.flatMap(e => catMatch(e, pool).map(i => i.id)));
  const smart = smartInfo(ev, pool, pool.filter(i => !known.has(i.id)));
  const need = pool.filter(i => i.kind === "bedarf" && !i.person).map(i => i.name);
  const basics = BASICS.filter(e => !entryState(e, pool).covered).map(e => e.n);
  const low = CATALOG.filter(g => smart.levels[g.id].level === "low").map(g => g.name);
  const list = [...new Set([...need, ...basics])];
  const url = location.origin + location.pathname + "?e=" + ev.id;
  const text = `🍕 ${ev.title} am ${fmtDate(ev.event_date,{weekday:'long',day:'numeric',month:'long'})}:` +
    (list.length ? ` Es fehlt noch ${list.join(", ")}.` : "") + (low.length ? ` Knapp ist noch: ${low.join(", ")}.` : "") +
    ` Wer bringt was mit? Einfach antippen: ${url}`;
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}

function similar(name, ev){
  const n = name.toLowerCase();
  const pool = items.filter(i => i.event_id === ev.id || (!i.event_id && i.kind === "vorrat"));
  const hit = pool.find(i => { const m = i.name.toLowerCase(); return m.includes(n) || n.includes(m); });
  return hit ? `„${hit.name}“${hit.person ? ` (${hit.person})` : hit.kind === "vorrat" ? " (ist schon da)" : ""}` : null;
}

async function hostLogin(){
  const k = prompt("Gastgeber-Schlüssel:"); if(!k) return;
  try{ if(await rpc("pz_admin_check",{p_key:k.trim()})){ adminKey = k.trim(); ls.set("pz_admin", adminKey); isAdmin = true; toast("Gastgeber-Modus an"); load(true); }
       else toast("Schlüssel stimmt nicht"); }catch(e){ toast(e.message); }
}

// Name merken, während getippt wird
document.addEventListener("input", e => { if(e.target.id === "nameInput"){ myName = e.target.value.trim(); ls.set("pz_name", myName); } });

// Start + regelmäßig aktualisieren (nur wenn sich etwas geändert hat und niemand tippt)
(async () => {
  // Persönlicher Gastgeber-Link: …/Pizzaabend/#gastgeber-SCHLÜSSEL (bleibt in der Adresse, damit Lesezeichen und Homescreen-Symbol ihn behalten)
  const hk = location.hash.match(/gastgeber-([A-Za-z0-9_-]+)/);
  if(hk){ adminKey = hk[1]; ls.set("pz_admin", adminKey); }
  if(adminKey){ try{ isAdmin = await rpc("pz_admin_check",{p_key:adminKey}); }catch(_){ } }
  load(true).catch(e => { document.getElementById("main").innerHTML = `<div class="card"><p>Konnte nicht laden: ${esc(e.message)}</p></div>`; });
})();
const busy = () => { const a = document.activeElement; return a && /INPUT|SELECT|TEXTAREA/.test(a.tagName); };
setInterval(() => { if(!document.hidden && !busy() && !editing) load().catch(()=>{}); }, 20000);
document.addEventListener("visibilitychange", () => { if(!document.hidden && !busy() && !editing) load().catch(()=>{}); });
</script>
